#!/system/bin/bash
# Konfigurasi untuk auto-download.sh
# Letakkan file ini di /data/adb/auto-download/auto-download.conf

# ===== KONFIGURASI DIREKTORI =====
# Direktori penyimpanan untuk provider
SAVE_DIR="/data/adb/box/sing-box/provider"

# Direktori penyimpanan untuk config.json
CONFIG_DIR="/data/adb/box/sing-box"

# Direktori sementara untuk file yang didownload
TEMP_DIR="/data/adb/auto-download/download_temp"

# ===== KONFIGURASI JADWAL =====
# Jadwal pemeriksaan file (format hh:mm, pisahkan dengan spasi)
SCHEDULE_HOURS="01:00 07:00 13:00 19:00 00:10 00:23 "

# Interval pemeriksaan jadwal (dalam detik)
CHECK_INTERVAL=600

# ===== KONFIGURASI LOG =====
# File log (kosongkan untuk menonaktifkan logging)
LOG_FILE="/data/adb/auto-download/auto-download.log"

# File log lama (akan berisi log dari eksekusi sebelumnya)
OLD_LOG_FILE="/data/adb/auto-download/auto-download_old.log"

# ===== KONFIGURASI PEMERIKSAAN =====
# Gunakan pemeriksaan hash SHA-1 (1 untuk aktif, 0 untuk nonaktif)
USE_SHA1_CHECK=1

# ===== KONFIGURASI JARINGAN =====
# Jumlah maksimum percobaan koneksi jaringan
NETWORK_MAX_ATTEMPTS=15

# Waktu tunggu antara percobaan koneksi (dalam detik)
NETWORK_RETRY_WAIT=3

# URL untuk pengujian koneksi jaringan
NETWORK_TEST_URL="https://www.google.com"

# ===== DAFTAR URL =====
# URL untuk config.json yang akan disimpan di direktori CONFIG_DIR
CONFIG_URL="https://raw.githubusercontent.com/exball/sing-box-config/Master/config.json"

# Daftar URL untuk file provider yang akan disimpan di direktori SAVE_DIR
# Format: satu URL per baris, diakhiri dengan tanda kutip dan spasi
PROVIDER_URLS=(
    "https://raw.githubusercontent.com/exball/sing-box-config/Master/Vmess%20Tls.json"
    "https://raw.githubusercontent.com/exball/sing-box-config/Master/Vmess%20Ntls.json"

    #ID
    "https://raw.githubusercontent.com/exball/sing-box-config/refs/heads/Master/ID%20vless%20tls.json"
    "https://raw.githubusercontent.com/exball/sing-box-config/refs/heads/Master/ID%20vless%20ntls.json"

    #SG
    "https://raw.githubusercontent.com/exball/sing-box-config/refs/heads/Master/SG%20vless%20tls.json"
    "https://raw.githubusercontent.com/exball/sing-box-config/refs/heads/Master/SG%20vless%20ntls.json"

    "https://raw.githubusercontent.com/exball/sing-box-config/refs/heads/Master/ID%20SG%20trojan%20tls%20ntls.json"
    "https://raw.githubusercontent.com/exball/sing-box-config/refs/heads/Master/backup.json"
)

# ===== KONFIGURASI TAMBAHAN =====
# Toleransi waktu untuk jadwal (dalam menit)
# Script akan menjalankan download jika waktu saat ini berada dalam rentang ini dari waktu yang dijadwalkan
SCHEDULE_TOLERANCE=1

# Waktu tunggu setelah boot sebelum menjalankan script (dalam detik)
BOOT_WAIT_TIME=20

# Waktu tunggu setelah restart layanan (dalam detik)
SERVICE_RESTART_WAIT=3
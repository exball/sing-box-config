name: Scan & Extract Proxy


on:
  workflow_dispatch:  # Memungkinkan menjalankan workflow secara manual dari GitHub UI
  schedule:
    # Runs at 00:00, 04:00, 08:00, 12:00, 16:00, 20:00 in UTC+8 timezone
    # Which is 16:00, 20:00, 00:00, 04:00, 08:00, 12:00 in UTC
    - cron: "0 16,20,0,4,8,12 * * *"

permissions:
  contents: write  # Memberikan izin untuk menulis ke repository

jobs:
  combined-workflow:
    runs-on: ubuntu-latest
    concurrency:
      group: proxy-scan-and-update
    
    steps:
      # Bagian 1: Proxy Scanner (dari scan.yaml)
      - name: Checkout repository for scanning
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GIT_TOKEN }}
          fetch-depth: 0  # Ambil semua history untuk memastikan git berfungsi dengan benar
      
      - name: Use Bun
        uses: oven-sh/setup-bun@v2
      
      - name: Start Scan
        run: |
          cd proxy-scaner && bun install && bun run ./proxyip.ts
      
      - name: Publish Scan Result
        if: ${{ success() }}
        run: |
          git config --global user.name "Github Actions"
          git config --global user.email "actions@github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add .
            git commit -m "Update proxyip"
            git push origin Master --force
          else
            echo "No changes detected, skipping commit and push."
          fi
      
      # Jeda 10 detik antara dua proses
      - name: Wait for 10 seconds
        run: sleep 10
        if: ${{ success() }}
      
      # Bagian 2: Update Proxy List (dari update-proxy.yml)
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests boto3 pytz pyyaml
          
          echo "Checking if extract.py exists in extract-outbound directory:"
          ls -la extract-outbound/extract.py || echo "extract.py not found"
          
          echo "Directory contents:"
          ls -la
      
      - name: Check configuration files
        run: |
          echo "Config file contents:"
          cat ./extract-outbound/config.ini
          
          echo "Format config file contents:"
          cat ./extract-outbound/sing_outbound.ini
          
          echo "Checking if clash_proxies.ini exists:"
          ls -la ./extract-outbound/clash_proxies.ini || echo "clash_proxies.ini not found"
          
          echo "Checking if proxy_history.json exists:"
          ls -la ./extract-outbound/proxy_history.json || echo "proxy_history.json not found (will be created)"
      
      - name: Sync configuration files
        run: |
          echo "🔄 Running sync_config.py to synchronize config.ini with config.json and auto-download.conf"
          cd extract-outbound && python sync_config.py
          cd ..
          
          echo "📋 Checking sync results:"
          echo "Config.json outbound_providers:"
          grep -A 20 '"outbound_providers"' config.json | head -20
          
          echo "Auto-download.conf PROVIDER_URLS:"
          grep -A 15 'PROVIDER_URLS=' auto-download/auto-download.conf | head -15

      - name: Run proxy extraction script
        run: |
          ls -la ./extract-outbound/
          
          cd extract-outbound && python extract.py -o sing_outbound.ini -f config.ini
          cd ..
          
          echo "Checking output files:"
          
          # Read format from config.ini to determine what files to check
          FORMAT=$(grep "^Format=" extract-outbound/config.ini | cut -d'=' -f2 | tr -d ' ' | tr -d '\r')
          echo "Detected format: '$FORMAT'"
          
          # Check files based on format
          case "$FORMAT" in
            "bfr"|"v2ray")
              echo "JSON files found in provider directory:"
              find ./provider -name "*.json" 2>/dev/null | sort || echo "provider directory not found"
              echo "Detailed file information:"
              ls -la ./provider/*.json 2>/dev/null || echo "No JSON files found"
              FILE_COUNT=$(find ./provider -name "*.json" 2>/dev/null | wc -l)
              echo "Total JSON files in provider: $FILE_COUNT"
              ;;
            "clash")
              echo "YAML files found in provider directory:"
              find ./provider -name "*.yaml" -o -name "*.yml" 2>/dev/null | sort || echo "No YAML files found"
              echo "Detailed file information:"
              ls -la ./provider/*.yaml 2>/dev/null || echo "No YAML files found"
              ls -la ./provider/*.yml 2>/dev/null || echo "No YML files found"
              FILE_COUNT=$(find ./provider -name "*.yaml" -o -name "*.yml" 2>/dev/null | wc -l)
              echo "Total YAML files in provider: $FILE_COUNT"
              ;;
            "raw"|"sfa")
              echo "TXT files found in provider directory:"
              find ./provider -name "*.txt" 2>/dev/null | sort || echo "No TXT files found"
              echo "Detailed file information:"
              ls -la ./provider/*.txt 2>/dev/null || echo "No TXT files found"
              FILE_COUNT=$(find ./provider -name "*.txt" 2>/dev/null | wc -l)
              echo "Total TXT files in provider: $FILE_COUNT"
              ;;
            *)
              echo "All files found in provider directory:"
              ls -la ./provider/ 2>/dev/null || echo "provider directory not found"
              FILE_COUNT=$(find ./provider -type f 2>/dev/null | wc -l)
              echo "Total files in provider: $FILE_COUNT"
              ;;
          esac
          
          # Show git status to see what files are changed
          echo "Git status:"
          git status --porcelain
          
          # Check if any output files were created
          if [ "$FILE_COUNT" -eq 0 ]; then
            echo "WARNING: No output files were created in provider directory!"
            exit 1
          fi
      
      - name: Upload to Cloudflare R2
        env:
          ENABLE_UPLOAD: "false"  # Ubah menjadi "true" jika ingin mengaktifkan upload
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET_NAME: cloud
          R2_FOLDER_NAME: sing-box_config
        run: |
          if [ "$ENABLE_UPLOAD" = "true" ]; then
            cd extract-outbound && python upload_to_r2.py
          else
            echo "Upload to R2 is disabled"
          fi
      
      - name: Determine file pattern based on format
        id: determine_pattern
        run: |
          echo "🔍 Reading format from config.ini..."
          
          # Baca format dari config.ini
          FORMAT=$(grep "^Format=" extract-outbound/config.ini | cut -d'=' -f2 | tr -d ' ' | tr -d '\r')
          
          echo "📋 Detected format: '$FORMAT'"
          
          # Tentukan file pattern berdasarkan format
          case "$FORMAT" in
            "bfr"|"v2ray")
              OUTPUT_PATTERN="provider/*.json"
              echo "📁 Using JSON pattern for format: $FORMAT"
              ;;
            "clash")
              OUTPUT_PATTERN="provider/*.yaml provider/*.yml"
              echo "📁 Using YAML pattern for format: $FORMAT"
              ;;
            "raw"|"sfa")
              OUTPUT_PATTERN="provider/*.txt"
              echo "📁 Using TXT pattern for format: $FORMAT"
              ;;
            *)
              OUTPUT_PATTERN="provider/*.json"
              echo "⚠️  Unknown format '$FORMAT', using default JSON pattern"
              ;;
          esac
          
          # Set output untuk step berikutnya
          echo "pattern=$OUTPUT_PATTERN" >> $GITHUB_OUTPUT
          echo "format=$FORMAT" >> $GITHUB_OUTPUT
          
          echo "✅ File pattern determined: $OUTPUT_PATTERN"
      
      - name: Commit and push if changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update proxy list and sync configurations [automated]"
          file_pattern: "${{ steps.determine_pattern.outputs.pattern }} extract-outbound/config.ini extract-outbound/sing_outbound.ini extract-outbound/clash_proxies.ini extract-outbound/proxy_history.json proxy-scaner/*.json proxy-scaner/*.txt proxy-scaner/active-proxy-history.txt config.json auto-download/auto-download.conf"
          commit_user_name: "GitHub Actions Bot"
          commit_user_email: "actions@github.com"
          commit_author: "GitHub Actions Bot <actions@github.com>"
          push_options: "--force"  # Gunakan --force jika diperlukan
      
      - name: Summary
        run: |
          echo "Workflow completed successfully!"
          echo "Format used: ${{ steps.determine_pattern.outputs.format }}"
          echo "File pattern used: ${{ steps.determine_pattern.outputs.pattern }}"
          
          # Tampilkan file yang dihasilkan berdasarkan format yang terdeteksi
          FORMAT="${{ steps.determine_pattern.outputs.format }}"
          case "$FORMAT" in
            "bfr"|"v2ray")
              echo "JSON files generated in provider directory:"
              find ./provider -name "*.json" 2>/dev/null | sort || echo "No JSON files found"
              echo "Total JSON files: $(find ./provider -name "*.json" 2>/dev/null | wc -l)"
              ;;
            "clash")
              echo "YAML files generated in provider directory:"
              find ./provider -name "*.yaml" -o -name "*.yml" 2>/dev/null | sort || echo "No YAML files found"
              echo "Total YAML files: $(find ./provider -name "*.yaml" -o -name "*.yml" 2>/dev/null | wc -l)"
              ;;
            "raw"|"sfa")
              echo "TXT files generated in provider directory:"
              find ./provider -name "*.txt" 2>/dev/null | sort || echo "No TXT files found"
              echo "Total TXT files: $(find ./provider -name "*.txt" 2>/dev/null | wc -l)"
              ;;
            *)
              echo "Files generated in provider directory:"
              ls -la ./provider/ 2>/dev/null || echo "No files found"
              ;;
          esac

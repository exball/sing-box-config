name: Scan & Extract Proxy


on:
  workflow_dispatch:  # Memungkinkan menjalankan workflow secara manual dari GitHub UI
  schedule:
    # Runs at 00:00, 06:00, 12:00, 18:00 in UTC+8 timezone
    # Which is 16:00, 24:00, 04:00, 10:00 in UTC
    - cron: "0 16,22,4,10 * * *"

permissions:
  contents: write  # Memberikan izin untuk menulis ke repository

jobs:
  combined-workflow:
    runs-on: ubuntu-latest
    concurrency:
      group: proxy-scan-and-update
    
    steps:
      # Bagian 1: Proxy Scanner (dari scan.yaml)
      - name: Checkout repository for scanning
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GIT_TOKEN }}
          fetch-depth: 0  # Ambil semua history untuk memastikan git berfungsi dengan benar
      
      - name: Use Bun
        uses: oven-sh/setup-bun@v2
      
      - name: Start Scan
        run: |
          cd proxy-scaner && bun install && bun run ./proxyip.ts
      
      - name: Publish Scan Result
        if: ${{ success() }}
        run: |
          git config --global user.name "Github Actions"
          git config --global user.email "actions@github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add .
            git commit -m "Update proxyip"
            git push origin Master --force
          else
            echo "No changes detected, skipping commit and push."
          fi
      
      # Jeda 10 detik antara dua proses
      - name: Wait for 10 seconds
        run: sleep 10
        if: ${{ success() }}
      
      # Bagian 2: Update Proxy List (dari update-proxy.yml)
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests boto3 pytz
          
          echo "Checking if extract_outbound.py exists in extract-outbound directory:"
          ls -la extract-outbound/extract_outbound.py || echo "extract_outbound.py not found"
          
          echo "Directory contents:"
          ls -la
      
      - name: Check configuration files
        run: |
          echo "Config file contents:"
          cat ./extract-outbound/config.ini
          
          echo "Format config file contents:"
          cat ./extract-outbound/config_format.ini
      
      - name: Sync configuration files
        run: |
          echo "🔄 Running sync_config.py to synchronize config.ini with config.json and auto-download.conf"
          cd extract-outbound && python sync_config.py
          cd ..
          
          echo "📋 Checking sync results:"
          echo "Config.json outbound_providers:"
          grep -A 20 '"outbound_providers"' config.json | head -20
          
          echo "Auto-download.conf PROVIDER_URLS:"
          grep -A 15 'PROVIDER_URLS=' auto-download/auto-download.conf | head -15

      - name: Run proxy extraction script
        run: |
          ls -la ./extract-outbound/
          
          cd extract-outbound && python extract_outbound.py -o config_format.ini -f config.ini
          cd ..
          
          echo "Checking output files:"
          # Check JSON files in outbound-provider directory
          echo "JSON files found in outbound-provider directory:"
          find ./outbound-provider -name "*.json" 2>/dev/null | sort || echo "outbound-provider directory not found"
          
          # Show detailed file information
          echo "Detailed file information:"
          ls -la ./outbound-provider/*.json 2>/dev/null || echo "No JSON files found"
          
          # Count total number of JSON files in outbound-provider directory
          JSON_COUNT=$(find ./outbound-provider -name "*.json" 2>/dev/null | wc -l)
          echo "Total JSON files in outbound-provider: $JSON_COUNT"
          
          # Show git status to see what files are changed
          echo "Git status:"
          git status --porcelain
          
          # Check if any JSON files were created
          if [ "$JSON_COUNT" -eq 0 ]; then
            echo "WARNING: No JSON files were created in outbound-provider directory!"
            exit 1
          fi
      
      - name: Upload to Cloudflare R2
        env:
          ENABLE_UPLOAD: "false"  # Ubah menjadi "true" jika ingin mengaktifkan upload
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET_NAME: cloud
          R2_FOLDER_NAME: sing-box_config
        run: |
          if [ "$ENABLE_UPLOAD" = "true" ]; then
            cd extract-outbound && python upload_to_r2.py
          else
            echo "Upload to R2 is disabled"
          fi
      
      - name: Commit and push if changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update proxy list and sync configurations [automated]"
          file_pattern: "outbound-provider/*.json extract-outbound/config.ini extract-outbound/config_format.ini proxy-scaner/*.json proxy-scaner/*.txt config.json auto-download/auto-download.conf"
          commit_user_name: "GitHub Actions Bot"
          commit_user_email: "actions@github.com"
          commit_author: "GitHub Actions Bot <actions@github.com>"
          push_options: "--force"  # Gunakan --force jika diperlukan
      
      - name: Summary
        run: |
          echo "Workflow completed successfully!"
          echo "JSON files generated in outbound-provider directory:"
          find ./outbound-provider -name "*.json" 2>/dev/null | sort || echo "No JSON files found"
          echo "Total JSON files: $(find ./outbound-provider -name "*.json" 2>/dev/null | wc -l)"

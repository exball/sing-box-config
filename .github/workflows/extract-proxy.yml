name: Extract Proxy

on:
  workflow_dispatch:


permissions:
  contents: write  # Memberikan izin untuk menulis ke repository

jobs:
  extract-proxy:
    runs-on: ubuntu-latest
    concurrency:
      group: proxy-extract-only
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GIT_TOKEN }}
          fetch-depth: 0  # Ambil semua history untuk memastikan git berfungsi dengan benar
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests boto3 pytz pyyaml
      
      - name: Verify files and directories
        run: |
          echo "🔍 Checking extract-outbound directory:"
          ls -la extract-outbound/
          
          echo "📋 Checking if extract.py exists:"
          ls -la extract-outbound/extract.py || echo "❌ extract.py not found"
          
          echo "📋 Checking config files:"
          ls -la extract-outbound/config.ini || echo "❌ Config file not found"
          ls -la extract-outbound/sing_outbound.ini || echo "⚠️ Output file not found (will be created)"
          
          echo "📋 Checking provider directory:"
          ls -la provider/ || echo "⚠️ Provider directory not found (will be created)"
      
      - name: Display configuration
        run: |
          echo "📋 Configuration file contents:"
          cat ./extract-outbound/${{ github.event.inputs.config_file || 'config.ini' }}
          
          echo "📋 Format configuration file contents:"
          cat ./extract-outbound/${{ github.event.inputs.output_file || 'sing_outbound.ini' }}
          
          echo "📋 Checking if clash_proxies.ini exists:"
          ls -la ./extract-outbound/clash_proxies.ini || echo "⚠️ clash_proxies.ini not found"
          
          echo "📋 Checking if proxy_history.json exists:"
          ls -la ./extract-outbound/proxy_history.json || echo "⚠️ proxy_history.json not found (will be created)"
      
      - name: Sync configuration files
        run: |
          echo "🔄 Running sync_config.py to synchronize config files"
          cd extract-outbound && python sync_config.py
          cd ..
          
          echo "📋 Checking sync results:"
          echo "Config.json outbound_providers:"
          grep -A 20 '"outbound_providers"' config.json | head -20 || echo "⚠️ No outbound_providers found in config.json"
          
          echo "Auto-download.conf PROVIDER_URLS:"
          grep -A 15 'PROVIDER_URLS=' auto-download/auto-download.conf | head -15 || echo "⚠️ No PROVIDER_URLS found in auto-download.conf"
      
      - name: Run proxy extraction
        run: |
          echo "🚀 Starting proxy extraction..."
          echo "📁 Working directory: $(pwd)"
          echo "📋 Config file: config.ini"
          echo "📋 Output file: sing_outbound.ini"
          
          cd extract-outbound
          python extract.py -o "sing_outbound.ini" -f "config.ini"
          cd ..
          
          echo "✅ Proxy extraction completed!"
      
      - name: Verify extraction results
        id: verify_results
        run: |
          echo "🔍 Checking extraction results..."
          
          # Read format from config.ini to determine what files to check
          FORMAT=$(grep "^Format=" extract-outbound/config.ini | cut -d'=' -f2 | tr -d ' ' | tr -d '\r')
          echo "📋 Detected format: '$FORMAT'"
          
          # Check files based on format
          case "$FORMAT" in
            "bfr"|"v2ray")
              echo "📁 JSON files found in provider directory:"
              find ./provider -name "*.json" 2>/dev/null | sort || echo "⚠️ No JSON files found"
              echo "📊 Detailed file information:"
              ls -la ./provider/*.json 2>/dev/null || echo "⚠️ No JSON files found"
              FILE_COUNT=$(find ./provider -name "*.json" 2>/dev/null | wc -l)
              FILE_PATTERN="provider/*.json"
              ;;
            "clash")
              echo "📁 YAML files found in provider directory:"
              find ./provider -name "*.yaml" -o -name "*.yml" 2>/dev/null | sort || echo "⚠️ No YAML files found"
              echo "📊 Detailed file information:"
              ls -la ./provider/*.yaml 2>/dev/null || echo "⚠️ No YAML files found"
              ls -la ./provider/*.yml 2>/dev/null || echo "⚠️ No YML files found"
              FILE_COUNT=$(find ./provider -name "*.yaml" -o -name "*.yml" 2>/dev/null | wc -l)
              FILE_PATTERN="provider/*.yaml provider/*.yml"
              ;;
            "raw"|"sfa")
              echo "📁 TXT files found in provider directory:"
              find ./provider -name "*.txt" 2>/dev/null | sort || echo "⚠️ No TXT files found"
              echo "📊 Detailed file information:"
              ls -la ./provider/*.txt 2>/dev/null || echo "⚠️ No TXT files found"
              FILE_COUNT=$(find ./provider -name "*.txt" 2>/dev/null | wc -l)
              FILE_PATTERN="provider/*.txt"
              ;;
            *)
              echo "📁 All files found in provider directory:"
              ls -la ./provider/ 2>/dev/null || echo "⚠️ Provider directory not found"
              FILE_COUNT=$(find ./provider -type f 2>/dev/null | wc -l)
              FILE_PATTERN="provider/*"
              ;;
          esac
          
          echo "📊 Total files created: $FILE_COUNT"
          
          # Set outputs for next steps
          echo "file_count=$FILE_COUNT" >> $GITHUB_OUTPUT
          echo "file_pattern=$FILE_PATTERN" >> $GITHUB_OUTPUT
          echo "format=$FORMAT" >> $GITHUB_OUTPUT
          
          # Show git status to see what files are changed
          echo "📋 Git status:"
          git status --porcelain
          
          # Check if any output files were created
          if [ "$FILE_COUNT" -eq 0 ]; then
            echo "❌ WARNING: No output files were created in provider directory!"
            exit 1
          else
            echo "✅ Successfully created $FILE_COUNT files in provider directory"
          fi
      

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update proxy extraction results [extract-only workflow]"
          file_pattern: "${{ steps.verify_results.outputs.file_pattern }} extract-outbound/config.ini extract-outbound/sing_outbound.ini extract-outbound/clash_proxies.ini extract-outbound/proxy_history.json config.json auto-download/auto-download.conf"
          commit_user_name: "GitHub Actions Bot"
          commit_user_email: "actions@github.com"
          commit_author: "GitHub Actions Bot <actions@github.com>"
          push_options: "--force"
      
      - name: Workflow Summary
        run: |
          echo "🎉 Workflow completed successfully!"
          echo "📋 Configuration used:"
          echo "  - Config file: config.ini"
          echo "  - Output file: sing_outbound.ini"
          echo "  - Format detected: ${{ steps.verify_results.outputs.format }}"
          echo "  - Files created: ${{ steps.verify_results.outputs.file_count }}"

          
          echo "📁 Files generated:"
          case "${{ steps.verify_results.outputs.format }}" in
            "bfr"|"v2ray")
              find ./provider -name "*.json" 2>/dev/null | sort || echo "No JSON files found"
              ;;
            "clash")
              find ./provider -name "*.yaml" -o -name "*.yml" 2>/dev/null | sort || echo "No YAML files found"
              ;;
            "raw"|"sfa")
              find ./provider -name "*.txt" 2>/dev/null | sort || echo "No TXT files found"
              ;;
            *)
              ls -la ./provider/ 2>/dev/null || echo "No files found"
              ;;
          esac
          
          echo "✅ All tasks completed successfully!"
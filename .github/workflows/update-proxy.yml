name: Update Proxy List

on:
  schedule:
    # Jalankan setiap 6 jam pada jam 00:30, 06:30, 12:30, dan 18:30
    - cron: '30 0,6,12,18 * * *'
  workflow_dispatch:  # Memungkinkan menjalankan workflow secara manual dari GitHub UI

permissions:
  contents: write  # Memberikan izin untuk menulis ke repository

jobs:
  update-proxy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Ambil semua history untuk memastikan git berfungsi dengan benar
        
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests boto3
          
          echo "Checking if extract_outbound.py exists:"
          ls -la extract_outbound.py || echo "extract_outbound.py not found"
          
          echo "Directory contents:"
          ls -la
          
      - name: Copy configuration files
        run: |
          # Copy config.ini from workflows directory to working directory
          cp .github/workflows/config.ini .
          echo "Config file contents:"
          cat config.ini
          
          # Copy config_format.ini from workflows directory to working directory
          cp .github/workflows/config_format.ini .
          echo "Format config file contents:"
          cat config_format.ini
          
      - name: Run proxy extraction script
        run: |
          ls -la
          
          python extract_outbound.py -o config_format.ini -f config.ini
          
          echo "Checking output files:"
          # Dynamically check all JSON files in the directory
          echo "JSON files found:"
          find . -maxdepth 1 -name "*.json" | sort
          
          # Count total number of JSON files
          JSON_COUNT=$(find . -maxdepth 1 -name "*.json" | wc -l)
          echo "Total JSON files: $JSON_COUNT"
          
          # Check if any JSON files were created
          if [ "$JSON_COUNT" -eq 0 ]; then
            echo "WARNING: No JSON files were created!"
            exit 1
          fi
      
      - name: Upload to Cloudflare R2
        env:
          ENABLE_UPLOAD: "false"  # Ubah menjadi "true" jika ingin mengaktifkan upload
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET_NAME: cloud
          R2_FOLDER_NAME: sing-box_config
        run: |
          if [ "$ENABLE_UPLOAD" = "true" ]; then
            python upload_to_r2.py
          else
            echo "Upload to R2 is disabled"
          fi
        
      - name: Commit and push if changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update proxy list [automated]"
          file_pattern: "*.json README.md config.ini config_format.ini"
          commit_user_name: "GitHub Actions Bot"
          commit_user_email: "actions@github.com"
          commit_author: "GitHub Actions Bot <actions@github.com>"
          push_options: "--force"  # Gunakan --force jika diperlukan
          
      - name: Summary
        run: |
          echo "Workflow completed successfully!"
          echo "JSON files generated:"
          find . -maxdepth 1 -name "*.json" | sort
          echo "Total JSON files: $(find . -maxdepth 1 -name "*.json" | wc -l)"

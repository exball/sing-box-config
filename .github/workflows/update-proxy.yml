name: Update Proxy List

on:
  schedule:
    # Jalankan setiap 6 jam
    - cron: '0 */6 * * *'
  workflow_dispatch:  # Memungkinkan menjalankan workflow secara manual dari GitHub UI

# Tambahkan izin untuk GITHUB_TOKEN
permissions:
  contents: write  # Memberikan izin untuk menulis ke repository

jobs:
  update-proxy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests
          
      - name: Run proxy extraction script
        run: python extract_outbound.py
        
      - name: Commit and push if changes
        run: |
          git config --global user.name 'GitHub Actions Bot'
          git config --global user.email 'actions@github.com'
          
          # Tambahkan semua file yang dihasilkan
          git add outbound.json README.md proxy-configs/
          
          # Gunakan -f untuk memaksa git menambahkan file dengan spasi dalam nama
          git add -f "proxy-configs/ID VLESS TLS.json" "proxy-configs/ID VLESS NTLS.json" "proxy-configs/ID TROJAN TLS.json" "proxy-configs/ID TROJAN NTLS.json" 2>/dev/null || true
          git add -f "proxy-configs/SG VLESS TLS.json" "proxy-configs/SG VLESS NTLS.json" "proxy-configs/SG TROJAN TLS.json" "proxy-configs/SG TROJAN NTLS.json" 2>/dev/null || true
          git add -f "proxy-configs/US VLESS TLS.json" "proxy-configs/US VLESS NTLS.json" "proxy-configs/US TROJAN TLS.json" "proxy-configs/US TROJAN NTLS.json" 2>/dev/null || true
          
          # Commit dan push dengan token autentikasi
          if ! git diff --quiet && ! git diff --staged --quiet; then
            git commit -m "Update proxy list [automated]"
            
            # Gunakan GITHUB_TOKEN untuk autentikasi (tidak perlu PAT)
            git push
          fi

name: Update Proxy List

on:
  schedule:
    # Jalankan setiap 6 jam
    - cron: '0 */6 * * *'
  workflow_dispatch:  # Memungkinkan menjalankan workflow secara manual dari GitHub UI

# Tambahkan izin untuk GITHUB_TOKEN
permissions:
  contents: write  # Memberikan izin untuk menulis ke repository

jobs:
  update-proxy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Ambil semua history untuk memastikan git berfungsi dengan benar
        
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests
          
          # Periksa apakah script ada
          echo "Checking if extract_outbound.py exists:"
          ls -la extract_outbound.py || echo "extract_outbound.py not found"
          
          # Tampilkan isi direktori untuk debugging
          echo "Directory contents:"
          ls -la
          
      - name: Run proxy extraction script
        run: |
          # Tampilkan isi direktori untuk debugging
          ls -la
          
          # Jalankan script dengan output verbose
          python extract_outbound.py
          
          # Periksa apakah file output telah dibuat
          echo "Checking output files:"
          ls -la outbound.json || echo "outbound.json not found"
          ls -la outbound-all.json || echo "outbound-all.json not found"
          ls -la "ID Vless TLS.json" || echo "ID Vless TLS.json not found"
        
      - name: Commit and push if changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update proxy list [automated]"
          file_pattern: "*.json README.md"
          commit_user_name: "GitHub Actions Bot"
          commit_user_email: "actions@github.com"
          commit_author: "GitHub Actions Bot <actions@github.com>"
          push_options: "--force"  # Gunakan --force jika diperlukan

name: Scan Proxy

on:
  workflow_dispatch:
  schedule:
    - cron: "0 16,19,22,1,4,7,10,13 * * *"

jobs:
  scan-proxy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GIT_TOKEN }}
          fetch-depth: 0
      - name: Use Bun
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: |
          cd proxy-scaner && bun install
      - name: Ensure output directory exists
        run: |
          mkdir -p proxy-scaner/proxy_list
      - name: Run Proxy Scanner
        run: |
          cd proxy-scaner && bun run ./proxyip.ts
      - name: Commit and push scan results
        run: |
          set -e
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          # Stage only the relevant generated files
          git add \
            proxy-scaner/proxy_data/*.json \
            proxy-scaner/proxy_list/*.txt \
            proxy-scaner/active-proxy-history.txt || true
          # Commit only if there are staged changes
          if ! git diff --cached --quiet; then
            git commit -m "chore: update proxy_data and proxy_list [skip ci]"
            git push origin Master
          else
            echo "No changes to commit."
          fi

      - name: Trigger upload-kv-storage workflow
        run: |
          echo "Triggering upload-kv-storage.yml workflow via GitHub API..."
          curl -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GIT_TOKEN }}" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/upload-kv-storage.yml/dispatches \
            -d '{"ref":"Master"}'
        env:
          GIT_TOKEN: ${{ secrets.GIT_TOKEN }}

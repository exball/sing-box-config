name: Scan Proxy

on:
  workflow_dispatch:
  schedule:
    - cron: "0 16,19,22,1,4,7,10,13 * * *"

jobs:
  scan-proxy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GIT_TOKEN }}
          fetch-depth: 0
      - name: Use Bun
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: |
          cd proxy-scaner && bun install
      - name: Run Proxy Scanner
        run: |
          cd proxy-scaner && bun run ./proxyip.ts
      - name: Commit and push scan results
        run: |
          set -e
          git config --global user.name "Github Actions"
          git config --global user.email "actions@github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add proxy-scaner/*.json proxy-scaner/*.txt proxy-scaner/active-proxy-history.txt
            git commit -m "Update proxy scan results"
            git push origin Master --force
          else
            echo "No changes detected, skipping commit and push."

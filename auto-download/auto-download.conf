#!/system/bin/sh
# Konfigurasi untuk auto-download.sh
# Letakkan file ini di /data/adb/auto-download/auto-download.conf
# Pemeriksaan hash SHA-1 selalu aktif untuk keamanan dan integritas file

# ===== KONFIGURASI DIREKTORI =====
SAVE_DIR="/data/adb/box/sing-box/provider"   # Direktori penyimpanan untuk provider
CONFIG_DIR="/data/adb/box/sing-box"          # Direktori penyimpanan untuk config.json
TEMP_DIR="/data/adb/auto-download/download_temp"

# ===== KONFIGURASI JADWAL =====
SCHEDULE_HOURS="01:00 04:00 07:00 10:00 13:00 16:00 19:00 22:00"   # Jadwal pemeriksaan file
CHECK_INTERVAL=1800                        # Interval (dalam detik)

# ===== KONFIGURASI LOG =====
LOG_FILE="/data/adb/auto-download/auto-download.log"   # File log (kosongkan untuk menonaktifkan logging)
OLD_LOG_FILE="/data/adb/auto-download/auto-download_old.log"

# ===== KONFIGURASI JARINGAN =====
NETWORK_MAX_ATTEMPTS=10   # Jumlah maksimum percobaan koneksi jaringan
NETWORK_RETRY_WAIT=2      # Waktu tunggu antara percobaan koneksi (dalam detik)
NETWORK_TEST_URL="https://www.gstatic.com/generate_204"

# ===== DAFTAR URL =====
# URL untuk config.json 
CONFIG_URL="https://raw.githubusercontent.com/exball/sing-box-config/refs/heads/Master/config.json"

# Daftar URL untuk file provider
# Format: satu URL per baris dengan backslash (\) di akhir setiap baris kecuali baris terakhir
PROVIDER_URLS="
https://raw.githubusercontent.com/exball/sing-box-config/refs/heads/Master/provider/Vmess%20Tls.json \
https://raw.githubusercontent.com/exball/sing-box-config/refs/heads/Master/provider/Vmess%20Ntls.json \
https://raw.githubusercontent.com/exball/sing-box-config/refs/heads/Master/provider/ID%20vless.json \
https://raw.githubusercontent.com/exball/sing-box-config/refs/heads/Master/provider/SG%20vless.json \
https://raw.githubusercontent.com/exball/sing-box-config/refs/heads/Master/provider/TH%20vless.json \
https://raw.githubusercontent.com/exball/sing-box-config/refs/heads/Master/provider/MY%20vless.json \
https://raw.githubusercontent.com/exball/sing-box-config/refs/heads/Master/provider/VN%20vless.json \
https://raw.githubusercontent.com/exball/sing-box-config/refs/heads/Master/provider/Backup.json
"

# ===== KONFIGURASI TAMBAHAN =====
SCHEDULE_TOLERANCE=1  #menit
BOOT_WAIT_TIME=30  #detik
SERVICE_RESTART_WAIT=3  #detik

# ===== KONFIGURASI WAKE-UP DETECTION =====
# Wake-up detection dari deep sleep
WAKE_UP_DETECTION_ENABLED=1           # 1=enabled, 0=disabled
WAKE_UP_CHECK_INTERVAL=60  #detik

# Wake-up debouncing untuk mencegah wake-up berulang
WAKE_UP_DEBOUNCE_ENABLED=1            # 1=enabled, 0=disabled
WAKE_UP_DEBOUNCE_INTERVAL=900  #detik

# ===== KONFIGURASI UPDATE SCRIPT =====
# Update file
CHECK_UPDATE_SCRIPT_URL="https://raw.githubusercontent.com/exball/sing-box-config/refs/heads/Master/auto-download/check-update.sh"
CHECK_UPDATE_SCRIPT_FILE="/data/adb/auto-download/check-update.sh"

# Restart script
RESTART_SCRIPT_URL="https://raw.githubusercontent.com/exball/sing-box-config/refs/heads/Master/auto-download/restart-auto-download.sh"
RESTART_SCRIPT_FILE="/data/adb/auto-download/restart-auto-download.sh"

# Boot script
BOOT_SCRIPT_URL="https://raw.githubusercontent.com/exball/sing-box-config/refs/heads/Master/auto-download/auto-download-boot.sh"
BOOT_SCRIPT_FILE="/data/adb/service.d/auto-download-boot.sh"


#!/system/bin/bash
# Konfigurasi untuk auto-download.sh
# Letakkan file ini di /data/adb/auto-download/auto-download.conf

# ===== KONFIGURASI PEMERIKSAAN =====
# Gunakan pemeriksaan hash SHA-1 
USE_SHA1_CHECK=1   # 1 untuk aktif, 0 untuk nonaktif

# ===== KONFIGURASI DIREKTORI =====
SAVE_DIR="/data/adb/box/sing-box/provider"   # Direktori penyimpanan untuk provider
CONFIG_DIR="/data/adb/box/sing-box"          # Direktori penyimpanan untuk config.json
TEMP_DIR="/data/adb/auto-download/download_temp"

# ===== KONFIGURASI JADWAL =====
SCHEDULE_HOURS="01:00 07:00 13:00 18:15 18:25 19:00"   # Jadwal pemeriksaan file
CHECK_INTERVAL=7200                        # Interval (dalam detik)

# ===== KONFIGURASI LOG =====
LOG_FILE="/data/adb/auto-download/auto-download.log"   # File log (kosongkan untuk menonaktifkan logging)
OLD_LOG_FILE="/data/adb/auto-download/auto-download_old.log"

# ===== KONFIGURASI JARINGAN =====
NETWORK_MAX_ATTEMPTS=15   # Jumlah maksimum percobaan koneksi jaringan
NETWORK_RETRY_WAIT=3      # Waktu tunggu antara percobaan koneksi (dalam detik)
NETWORK_TEST_URL="https://www.google.com"

# ===== DAFTAR URL =====
# URL untuk config.json 
CONFIG_URL="https://raw.githubusercontent.com/exball/sing-box-config/Master/config.json"

# Daftar URL untuk file provider (kompatibel dengan sh)
# Setiap URL dipisahkan dengan spasi, gunakan backslash untuk multi-line
PROVIDER_URLS="
https://raw.githubusercontent.com/exball/sing-box-config/refs/heads/Master/outbound-provider/Vmess%20Tls.json \
https://raw.githubusercontent.com/exball/sing-box-config/refs/heads/Master/outbound-provider/Vmess%20Ntls.json \
https://raw.githubusercontent.com/exball/sing-box-config/refs/heads/Master/outbound-provider/ID%20vless%20tls.json \
https://raw.githubusercontent.com/exball/sing-box-config/refs/heads/Master/outbound-provider/ID%20vless%20ntls.json \
https://raw.githubusercontent.com/exball/sing-box-config/refs/heads/Master/outbound-provider/SG%20vless%20tls.json \
https://raw.githubusercontent.com/exball/sing-box-config/refs/heads/Master/outbound-provider/SG%20vless%20ntls.json \
https://raw.githubusercontent.com/exball/sing-box-config/refs/heads/Master/outbound-provider/ID%20SG%20trojan%20tls%20ntls.json \
https://raw.githubusercontent.com/exball/sing-box-config/refs/heads/Master/outbound-provider/backup.json
"

# ===== KONFIGURASI TAMBAHAN =====
# Toleransi waktu untuk jadwal (dalam menit)
# Script akan menjalankan download jika waktu saat ini berada dalam rentang ini dari waktu yang dijadwalkan
SCHEDULE_TOLERANCE=1     # Toleransi dari SCHEDULE_HOURS -+ (dalam menit)
BOOT_WAIT_TIME=10        # Waktu tunggu setelah boot
SERVICE_RESTART_WAIT=3   # Waktu tunggu setelah restart

# ===== KONFIGURASI UPDATE SCRIPT =====
# Update file
CHECK_UPDATE_SCRIPT_URL="https://raw.githubusercontent.com/exball/sing-box-config/refs/heads/Master/auto-download/check-update.sh"
CHECK_UPDATE_SCRIPT_FILE="/data/adb/auto-download/check-update.sh"

# Restart script
RESTART_SCRIPT_URL="https://raw.githubusercontent.com/exball/sing-box-config/refs/heads/Master/auto-download/restart-auto-download.sh"
RESTART_SCRIPT_FILE="/data/adb/auto-download/restart-auto-download.sh"

# Konfigurasi untuk extract_outbound.py
# 
# Format konfigurasi:
# [Komentar/Judul konfigurasi]
# Country_ID= [Kode negara, dipisahkan koma jika lebih dari satu]
# Protocol= [Protokol: vless, trojan]
# Security= [Keamanan: tls, ntls]
# Output_Name= [Nama file output]
#
# Daftar kode negara yang tersedia:
# ID (Indonesia), SG (Singapore), US (United States), JP (Japan), KR (South Korea),
# HK (Hong Kong), TW (Taiwan), GB (United Kingdom), DE (Germany), FR (France),
# CA (Canada), AU (Australia), NL (Netherlands), RU (Russia), IN (India),
# BR (Brazil), IT (Italy), ES (Spain), MX (Mexico), TR (Turkey)
#
# Daftar protokol yang tersedia:
# vless, trojan
#
# Daftar keamanan yang tersedia:
# tls, ntls

#ID vless tls
Country_ID= ID
Protocol= vless
Security= tls
Output_Name= ID vless tls.json

#ID vless ntls
Country_ID= ID
Protocol= vless
Security= ntls
Output_Name= ID vless ntls.json

#SG vless tls
Country_ID= SG
Protocol= vless
Security= tls
Output_Name= SG vless tls.json

#SG vless ntls
Country_ID= SG
Protocol= vless
Security= ntls
Output_Name= SG vless ntls.json

#ID SG trojan tls ntls
Country_ID= ID, SG
Protocol= trojan
Security= tls, ntls
Output_Name= ID SG trojan tls ntls.json

#KR, JP, US vless tls ntls
Country_ID= KR, JP, US, CN, VT,
Protocol= vless
Security= tls, ntls
Output_Name= backup.json